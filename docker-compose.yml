version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petvia-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: petvia
      POSTGRES_PASSWORD: petvia
      POSTGRES_DB: petvia
    volumes:
      - petvia_pgdata:/var/lib/postgresql/data

volumes:
  petvia_pgdata:
